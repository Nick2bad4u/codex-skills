codecov:
    max_report_age: false # Codecov misclassifies coverage.py millisecond timestamps as expired.
    require_ci_to_pass: true

comment:
    behavior: "default"
    layout: "reach,diff,flags,tree"
    require_changes: true
coverage:
    precision: 2
    range: "80...100"
    round: "down"
    status:
        patch:
            default:
                if_ci_failed: "error"

                target: "80%"
                threshold: "1%"
        project:
            python:
                flags:
                    - "python"
                if_ci_failed: "error"
                target: "80%"
                threshold: "1%"
