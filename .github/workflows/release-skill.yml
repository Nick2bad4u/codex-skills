# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Release Skill Bundle"

run-name: "Release Skill Bundle • ${{ github.ref_name || inputs.version || inputs.release_type }} @${{ github.actor }}"

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            release_type:
                description: "Release bump type"
                required: true
                default: "patch"
                type: "choice"
                options:
                    - "patch"
                    - "minor"
                    - "major"
            version:
                description: "Explicit release version in x.y.z format (overrides release_type)"
                required: false
                type: "string"
            ref:
                description: "Branch to release from when running manually"
                required: false
                default: "main"
                type: "string"

defaults:
    run:
        shell: "bash"

concurrency:
    group: "release-skill"
    cancel-in-progress: "${{ false }}"

jobs:
    release:
        name: "Package and publish skills"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        permissions:
            contents: "write"
            id-token: "write"

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0
                  ref: "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}"

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false

            - name: "Setup npm"
              run: |
                  npm install --global npm@12.0.2 --prefix "${RUNNER_TEMP}/npm"
                  echo "${RUNNER_TEMP}/npm/bin" >> "${GITHUB_PATH}"
                  "${RUNNER_TEMP}/npm/bin/npm" --version

            - name: "Setup Python"
              uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
              with:
                  python-version: "3.14"
                  cache: "pip"
                  cache-dependency-path: "requirements-dev.in"

            - name: "Install"
              run: "npm ci"

            - name: "Install Python"
              run: "python -m pip install --require-hashes -r requirements-dev.in"

            - name: "Resolve release tag"
              id: "vars"
              env:
                  EVENT_NAME: "${{ github.event_name }}"
                  INPUT_RELEASE_TYPE: "${{ inputs.release_type }}"
                  INPUT_VERSION: "${{ inputs.version }}"
              run: |
                  set -euo pipefail

                  if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
                    EXPLICIT_VERSION="${INPUT_VERSION}"
                    RELEASE_TYPE="${INPUT_RELEASE_TYPE}"

                    if [ -n "${EXPLICIT_VERSION}" ]; then
                      if ! [[ "${EXPLICIT_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                        echo "version must be a SemVer x.y.z value without prerelease or build metadata" >&2
                        exit 1
                      fi
                      NEXT_VERSION="${EXPLICIT_VERSION}"
                    else
                      REACHABLE_TAGS="$(git tag --merged HEAD --list 'v*' --sort=-v:refname)"
                      LATEST_TAG=""

                      while IFS= read -r CANDIDATE_TAG; do
                        if [[ "${CANDIDATE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                          LATEST_TAG="${CANDIDATE_TAG}"
                          break
                        fi
                      done <<< "${REACHABLE_TAGS}"

                      if [ -n "${LATEST_TAG}" ]; then
                        BASE_VERSION="${LATEST_TAG#v}"
                      else
                        BASE_VERSION="$(node -p "require('./package.json').version")"
                      fi

                      if ! [[ "${BASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                        echo "Base version '${BASE_VERSION}' is not a SemVer x.y.z value" >&2
                        exit 1
                      fi

                      IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VERSION}"

                      case "${RELEASE_TYPE}" in
                        patch)
                          PATCH=$((PATCH + 1))
                          ;;
                        minor)
                          MINOR=$((MINOR + 1))
                          PATCH=0
                          ;;
                        major)
                          MAJOR=$((MAJOR + 1))
                          MINOR=0
                          PATCH=0
                          ;;
                        *)
                          echo "Unsupported release_type: ${RELEASE_TYPE}" >&2
                          exit 1
                          ;;
                      esac

                      NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
                    fi

                    TAG="v${NEXT_VERSION}"
                  else
                    TAG="${GITHUB_REF_NAME}"
                  fi

                  if ! [[ "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                    echo "Resolved tag '${TAG}' is not in vX.Y.Z format" >&2
                    exit 1
                  fi

                  TARGET="$(git rev-parse HEAD)"
                  VERSION="${TAG#v}"
                  ASSET="codex-skills-${TAG}.zip"

                  {
                    echo "tag=${TAG}"
                    echo "version=${VERSION}"
                    echo "target=${TARGET}"
                    echo "asset=${ASSET}"
                  } >> "$GITHUB_OUTPUT"

            - name: "Prepare expected release tag for manual runs"
              if: "github.event_name == 'workflow_dispatch'"
              env:
                  EXPECTED_TAG: "${{ steps.vars.outputs.tag }}"
              run: |
                  set -euo pipefail

                  if [ -z "$EXPECTED_TAG" ]; then
                    echo "::error::The release version step did not provide an expected tag."
                    exit 1
                  fi

                  if git ls-remote --exit-code --refs --tags origin "refs/tags/${EXPECTED_TAG}" >/dev/null; then
                    echo "::error::Remote release tag ${EXPECTED_TAG} already exists; refusing to reuse it during a manual release."
                    exit 1
                  else
                    remote_tag_status=$?
                    if [ "$remote_tag_status" -ne 2 ]; then
                      echo "::error::Unable to verify whether remote release tag ${EXPECTED_TAG} exists."
                      exit "$remote_tag_status"
                    fi
                  fi

                  if git show-ref --verify --quiet "refs/tags/${EXPECTED_TAG}"; then
                    echo "::error::Expected release tag ${EXPECTED_TAG} already exists; refusing to replace it during a manual release."
                    exit 1
                  fi

                  git tag "$EXPECTED_TAG" HEAD

            - name: "Validate expected release tag"
              env:
                  EXPECTED_TAG: "${{ steps.vars.outputs.tag }}"
              run: |
                  set -euo pipefail

                  if [ -z "$EXPECTED_TAG" ]; then
                    echo "::error::The release version step did not provide an expected tag."
                    exit 1
                  fi

                  tag_ref="refs/tags/${EXPECTED_TAG}"
                  if ! git show-ref --verify --quiet "$tag_ref"; then
                    echo "::error::Expected release tag ${EXPECTED_TAG} does not exist in the local checkout."
                    exit 1
                  fi

                  tag_commit=$(git rev-parse "${tag_ref}^{commit}")
                  head_commit=$(git rev-parse HEAD)
                  if [ "$tag_commit" != "$head_commit" ]; then
                    echo "::error::Expected release tag ${EXPECTED_TAG} points to ${tag_commit}, but HEAD is ${head_commit}."
                    exit 1
                  fi

                  head_tags=$(git tag --points-at HEAD --sort=refname)
                  if [ "$head_tags" != "$EXPECTED_TAG" ]; then
                    echo "::error::HEAD must have exactly the expected release tag ${EXPECTED_TAG}; found: ${head_tags:-<none>}."
                    exit 1
                  fi

            - name: "Verify publication targets are unused"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  PACKAGE_VERSION: "${{ steps.vars.outputs.version }}"
                  RELEASE_TAG: "${{ steps.vars.outputs.tag }}"
              run: |
                  set -euo pipefail

                  package_name="$(node -p "require('./package.json').name")"
                  npm_error="${RUNNER_TEMP}/npm-view-error.log"

                  if npm view "${package_name}@${PACKAGE_VERSION}" version --json >/dev/null 2>"$npm_error"; then
                    echo "::error::${package_name}@${PACKAGE_VERSION} is already published; refusing to overwrite or skip it."
                    exit 1
                  else
                    npm_status=$?
                    if ! grep -q "E404" "$npm_error"; then
                      echo "::error::Unable to prove that ${package_name}@${PACKAGE_VERSION} is unpublished."
                      sed 's/^/npm: /' "$npm_error" >&2
                      exit "$npm_status"
                    fi
                  fi

                  github_error="${RUNNER_TEMP}/github-release-error.log"
                  if gh api --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>"$github_error"; then
                    echo "::error::GitHub release ${RELEASE_TAG} already exists; refusing to edit or clobber it."
                    exit 1
                  else
                    github_status=$?
                    if ! grep -q "HTTP 404" "$github_error"; then
                      echo "::error::Unable to prove that GitHub release ${RELEASE_TAG} does not exist."
                      sed 's/^/gh: /' "$github_error" >&2
                      exit "$github_status"
                    fi
                  fi

            - name: "Prepare npm package version"
              run: "npm version --no-git-tag-version '${{ steps.vars.outputs.version }}'"

            - name: "Generate full changelog"
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  TAG: "${{ steps.vars.outputs.tag }}"
              run: |
                  npm run changelog:generate -- --tag "$TAG"
                  # git-cliff's Markdown tables require two passes to reach Prettier's fixed point.
                  node node_modules/prettier/bin/prettier.cjs CHANGELOG.md --write --log-level warn
                  node node_modules/prettier/bin/prettier.cjs CHANGELOG.md --write --log-level warn
                  node node_modules/prettier/bin/prettier.cjs CHANGELOG.md --check --log-level warn

            - name: "Validate npm package"
              run: "npm run release:verify"

            - name: "Generate release notes"
              id: "git-cliff"
              uses: "orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5" # v4
              with:
                  config: "node_modules/gitcliff-config-nick2bad4u/cliff.toml"
                  args: "--verbose --tag ${{ steps.vars.outputs.tag }} --strip header"
              env:
                  OUTPUT: "release-notes.md"
                  GITHUB_REPO: "${{ github.repository }}"
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Build release bundle"
              env:
                  ASSET: "${{ steps.vars.outputs.asset }}"
              run: |
                  pack_result="${RUNNER_TEMP}/npm-pack.json"
                  package_dir="${RUNNER_TEMP}/release-package"

                  mkdir -p dist
                  npm pack --json --pack-destination "${RUNNER_TEMP}" --allow-directory=all > "$pack_result"

                  tarball="$(
                    PACK_RESULT="$pack_result" node --input-type=commonjs -e '
                      const { readFileSync } = require("node:fs");
                      const result = JSON.parse(readFileSync(process.env.PACK_RESULT, "utf8"));
                      const packages = Array.isArray(result) ? result : Object.values(result);

                      if (packages.length !== 1 || typeof packages[0]?.filename !== "string") {
                        throw new Error("npm pack did not return exactly one tarball filename");
                      }

                      process.stdout.write(packages[0].filename);
                    '
                  )"

                  if [ -z "$tarball" ] || [ "$tarball" != "$(basename "$tarball")" ]; then
                    echo "::error::npm pack did not return a safe tarball filename."
                    exit 1
                  fi

                  mkdir -p "$package_dir"
                  tar --extract --gzip --file "${RUNNER_TEMP}/${tarball}" \
                    --directory "$package_dir" --strip-components=1

                  if [ ! -f "${package_dir}/CHANGELOG.md" ]; then
                    echo "::error::The npm package manifest omitted CHANGELOG.md."
                    exit 1
                  fi

                  (
                    cd "$package_dir"
                    zip -r "${GITHUB_WORKSPACE}/dist/${ASSET}" .
                  )

            - name: "Upload workflow artifact"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
              with:
                  name: "${{ steps.vars.outputs.asset }}"
                  path: "dist/${{ steps.vars.outputs.asset }}"
                  if-no-files-found: "error"
                  retention-days: 7

            - name: "Publish npm package"
              run: "npm publish --access public --provenance"

            - name: "Publish GitHub release asset"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  TAG: "${{ steps.vars.outputs.tag }}"
                  ASSET: "dist/${{ steps.vars.outputs.asset }}"
                  NOTES: "${{ steps.git-cliff.outputs.changelog }}"
                  TARGET: "${{ steps.vars.outputs.target }}"
              run: |
                  gh release create "$TAG" "$ASSET" --target "$TARGET" --title "$TAG" --notes-file "$NOTES"
